<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,100..900;1,100..900&amp;family=Source+Sans+3:ital,wght@0,200..900;1,200..900&amp;display=swap"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Kontakt | Korp & Koppar</title>
  </head>

  <body>
    <!-- HEADER -->
    <header>
      <img class="logo-image" src="images/raven-small.svg" alt="" />

      <div class="logo">
        <a class="logo-text" href="index.html">Korp & Koppar</a>
        <p>
          FIKA <span class="dot">&bull;</span> HANTVERK
          <span class="dot">&bull;</span>
          GEMENSKAP
        </p>
      </div>

      <!--NAVIGERING-->      

      <button class="menu-toggle">☰</button>
      <nav class="menu">
        <ul>
          <li><a href="index.html">Hem</a></li>
          <li><a href="fika-butik.html">Fika &amp; butik</a></li>
          <li><a href="pyssel.html">Pyssel &amp; träffar</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
      </nav>

    </header>

    <!-- KONTAKTFORMULÄR, HITTA HIT-->
    <main class="contact-page">
      <h1>Kontakt & hitta hit</h1>

      <section>
        <h2>Besök Korp & Koppar</h2>
        <p>Välkommen förbi för fika, hantverk och en stund tillsammans.</p>
      </section>

      <section>
        <h2>Kontakta oss</h2>
        <p>Har du frågor om caféet, butiken eller våra pysselträffar?</p>

        <!-- Kontaktformuläret-->
        <form id="contact-form">
          <div class="form-field">
            <label for="name">Namn</label>
            <input
              type="text"
              id="name"
              name="name"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-field">
            <label for="email">E-post</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>

          <div class="message-field">
            <label for="message">Meddelande</label>
            <textarea id="message" name="message" rows="4" cols="20"></textarea>
            

          </div>

            <div class="submit">
              <input
                type="submit"
                value="Skicka in">
        
            </div>

<div class="reset">
      <input type="reset" value="Återställ" />
</div>

        </form>
      </section>
    </main>

    <!-- FOOTER -->
    <footer>
      <img
        class="logo-footer"
        src="images/raven-small.svg"
        alt="Korp &amp; Koppar"
      />

      <img class="footer-leaf" src="images/footer-leaf.png" alt="" />
      <p>Välkommen in</p>
      <img class="footer-leaf2" src="images/footer-leaf.png" alt="" />

      <ul class="social-links">
        <li>
          <a href="https://www.instagram.com/">
            <img src="images/instagram.svg" alt="Instagram" />
          </a>
        </li>
        <li>
          <a href="https://www.facebook.com/">
            <img src="images/facebook.svg" alt="Facebook" />
          </a>
        </li>
      </ul>
    </footer>
  </body>
</html>
